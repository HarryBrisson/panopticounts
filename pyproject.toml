[project]
name = "panopticounts"
version = "0.1.0"
description = "License-plate readers across Chicago's wards, community areas and tracts: a byop/v1 measure source for Penlight."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "shapely>=2.0", "pyproj>=3.6"]
[project.optional-dependencies]
dev = ["pytest>=7"]
[tool.setuptools]
packages = ["panopticounts"]
[tool.pytest.ini_options]
testpaths = ["tests"]
